name: GoREST API Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Run API tests
        run: |
          newman run "2474802010153_ChâuQuangHưng_GoRest.postman_collection.json" \
            -e "2474802010153_ChauQuangHung_GoRest_Env.postman_environment.json" \
            --env-var "baseurl=https://gorest.co.in" \
            --env-var "token=${{ secrets.GOREST_TOKEN }}"
