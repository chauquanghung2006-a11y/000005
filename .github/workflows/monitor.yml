name: API Monitor

on:
  schedule:
    - cron: '0 * * * *'   # chạy mỗi giờ
  workflow_dispatch:       # cho phép bấm chạy tay

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check GET /users (status 200 và response time < 800ms)
        run: |
          RESULT=$(curl -s -o /dev/null \
            -w "%{http_code} %{time_total}" \
            -H "Authorization: Bearer ${{ secrets.GOREST_TOKEN }}" \
            https://gorest.co.in/public/v2/users)

          STATUS=$(echo "$RESULT" | awk '{print $1}')
          TIME_MS=$(echo "$RESULT" | awk '{printf "%d", $2 * 1000}')

          echo "HTTP status   : $STATUS"
          echo "Response time : ${TIME_MS} ms (ngưỡng: 800 ms)"

          if [ "$STATUS" != "200" ]; then
            echo "FAIL: API không trả về 200"
            exit 1
          fi

          if [ "$TIME_MS" -ge 800 ]; then
            echo "FAIL: Thời gian phản hồi vượt 800ms"
            exit 1
          fi

          echo "PASS: API khỏe, phản hồi dưới 800ms"
