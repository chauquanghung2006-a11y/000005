name: API Monitor

on:
  schedule:
    - cron: '0 * * * *'   # chạy mỗi giờ
  workflow_dispatch:       # cho phép bấm chạy tay

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check GET /users (status 200 và response time < 800ms)
        run: |
          # Làm nóng kết nối, không tính vào kết quả
          curl -s -o /dev/null https://gorest.co.in/public/v2/users

          TOTAL=0
          RUNS=3

          for i in $(seq 1 $RUNS); do
            RESULT=$(curl -s -o /dev/null \
              -w "%{http_code} %{time_starttransfer}" \
              -H "Authorization: Bearer ${{ secrets.GOREST_TOKEN }}" \
              https://gorest.co.in/public/v2/users)

            STATUS=$(echo "$RESULT" | awk '{print $1}')
            TIME_MS=$(echo "$RESULT" | awk '{printf "%d", $2 * 1000}')

            echo "Lần $i -> status: $STATUS, time: ${TIME_MS} ms"

            if [ "$STATUS" != "200" ]; then
              echo "FAIL: API không trả về 200"
              exit 1
            fi

            TOTAL=$((TOTAL + TIME_MS))
          done

          AVG=$((TOTAL / RUNS))
          echo "Thời gian phản hồi trung bình: ${AVG} ms (ngưỡng: 800 ms)"

          if [ "$AVG" -ge 800 ]; then
            echo "FAIL: Trung bình vượt 800ms"
            exit 1
          fi

          echo "PASS: API khỏe, phản hồi trung bình dưới 800ms"
